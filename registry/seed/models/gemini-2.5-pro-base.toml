# Seed values are advisory and may lag; refresh via `sluice models update` (design §9.6).
#
# Provider-agnostic base facts for Google's Gemini 2.5 Pro, shared by any
# provider-serving entry that inherits via
# `base_model = "gemini-2.5-pro-base"`
# (registry/seed/providers/google/gemini-2.5-pro.toml). This file's own id
# ("gemini-2.5-pro-base") is never looked up directly — it only exists as an
# inheritance target, deliberately distinct from the real model id so it
# can't collide with it in the `base_model` chain.

modalities = ["text", "image", "audio"]

[limit]
context = 1048576
output = 65536
