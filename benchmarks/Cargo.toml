[package]
name = "sluice-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "End-to-end overhead benchmarks for sluice (not published)."

[dependencies]
sluice = { path = ".." }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
